<svg xmlns="http://www.w3.org/2000/svg" width="680" height="610" viewBox="0 0 680 610" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Backend architecture for the live football social platform</title>
<desc>Client web app talks to a Next.js server for writes and to Supabase directly for reads and realtime. Supabase holds Postgres, Auth, Storage and Realtime. A separate always-on ingestion worker polls an external football data provider and writes matches and events into Supabase.</desc>
<style>
text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
.c-purple rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}
.c-purple .th{fill:#3C3489}
.c-purple .ts{fill:#534AB7}
.c-teal rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}
.c-teal .th{fill:#085041}
.c-teal .ts{fill:#0F6E56}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g class="c-purple">
<rect x="190" y="40" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="63" text-anchor="middle">Client — web app</text>
<text class="ts" x="340" y="81" text-anchor="middle">Browser (Next.js)</text>
</g>

<g class="c-purple">
<rect x="205" y="132" width="270" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="155" text-anchor="middle">Next.js server (Vercel)</text>
<text class="ts" x="340" y="173" text-anchor="middle">Writes: validate + moderate</text>
</g>

<rect x="60" y="228" width="560" height="150" rx="16" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 5"/>
<text class="th" x="80" y="252" text-anchor="start">Supabase — managed platform</text>

<g class="c-teal">
<rect x="80" y="286" width="118" height="72" rx="8" stroke-width="0.5"/>
<text class="th" x="139" y="314" text-anchor="middle">Postgres</text>
<text class="ts" x="139" y="334" text-anchor="middle">SQL + RLS</text>
</g>
<g class="c-teal">
<rect x="214" y="286" width="118" height="72" rx="8" stroke-width="0.5"/>
<text class="th" x="273" y="314" text-anchor="middle">Auth</text>
<text class="ts" x="273" y="334" text-anchor="middle">users</text>
</g>
<g class="c-teal">
<rect x="348" y="286" width="118" height="72" rx="8" stroke-width="0.5"/>
<text class="th" x="407" y="314" text-anchor="middle">Storage</text>
<text class="ts" x="407" y="334" text-anchor="middle">images</text>
</g>
<g class="c-teal">
<rect x="482" y="286" width="118" height="72" rx="8" stroke-width="0.5"/>
<text class="th" x="541" y="314" text-anchor="middle">Realtime</text>
<text class="ts" x="541" y="334" text-anchor="middle">broadcast</text>
</g>

<g class="c-purple">
<rect x="190" y="410" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="433" text-anchor="middle">Ingestion worker</text>
<text class="ts" x="340" y="451" text-anchor="middle">Always-on · poller + adapter</text>
</g>

<g class="c-teal">
<rect x="210" y="500" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="523" text-anchor="middle">Football data provider</text>
<text class="ts" x="340" y="541" text-anchor="middle">external, licensed API</text>
</g>

<line x1="300" y1="98" x2="300" y2="129" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="292" y="117" text-anchor="end">writes</text>
<line x1="480" y1="96" x2="520" y2="225" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="528" y="150" text-anchor="start">reads + live</text>
<line x1="340" y1="188" x2="340" y2="225" class="arr" marker-end="url(#arrow)"/>

<line x1="340" y1="410" x2="340" y2="381" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="396" text-anchor="start">upsert · broadcast</text>

<line x1="322" y1="466" x2="322" y2="499" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="314" y="486" text-anchor="end">poll</text>
<line x1="360" y1="499" x2="360" y2="466" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="368" y="486" text-anchor="start">events</text>

<rect class="c-purple" x="196" y="578" width="12" height="12" rx="3"/>
<text class="ts" x="214" y="588" text-anchor="start">our code</text>
<rect class="c-teal" x="300" y="578" width="12" height="12" rx="3"/>
<text class="ts" x="318" y="588" text-anchor="start">managed / external services</text>
</svg>
