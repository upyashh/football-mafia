<svg xmlns="http://www.w3.org/2000/svg" width="680" height="680" viewBox="0 0 680 680" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Live match event pipeline and realtime fan-out</title>
<desc>A goal event flows from the external provider through the ingestion worker, is deduped and written to Postgres, broadcast to the match room channel, then delivered to every connected client. Each delivery counts as one realtime event, so events per second equal messages per second times clients in the room, which is where big rooms hit the throughput ceiling.</desc>
<style>
text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.t{font-size:14px;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
.c-purple rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}
.c-purple .th{fill:#3C3489}
.c-purple .ts{fill:#534AB7}
.c-teal rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}
.c-teal .th{fill:#085041}
.c-teal .ts{fill:#0F6E56}
.c-amber rect,rect.c-amber{fill:#FAEEDA;stroke:#854F0B}
.c-amber .th{fill:#633806}
.c-amber .ts{fill:#854F0B}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g class="c-teal">
<rect x="190" y="40" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="63" text-anchor="middle">Football data provider</text>
<text class="ts" x="340" y="81" text-anchor="middle">delayed live feed (external)</text>
</g>

<g class="c-purple">
<rect x="190" y="132" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="155" text-anchor="middle">Worker: poll + adapter</text>
<text class="ts" x="340" y="173" text-anchor="middle">normalize to our IDs</text>
</g>

<g class="c-purple">
<rect x="190" y="224" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="247" text-anchor="middle">Detect new event</text>
<text class="ts" x="340" y="265" text-anchor="middle">dedupe by event key</text>
</g>

<g class="c-teal">
<rect x="190" y="316" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="339" text-anchor="middle">Postgres · match_events</text>
<text class="ts" x="340" y="357" text-anchor="middle">durable record</text>
</g>

<g class="c-teal">
<rect x="190" y="408" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="431" text-anchor="middle">Realtime broadcast</text>
<text class="ts" x="340" y="449" text-anchor="middle">room:match channel</text>
</g>

<line x1="340" y1="98" x2="340" y2="129" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="117" text-anchor="start">poll 15–30s while live</text>
<line x1="340" y1="190" x2="340" y2="221" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="209" text-anchor="start">diff vs last poll</text>
<line x1="340" y1="282" x2="340" y2="313" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="301" text-anchor="start">insert (service role)</text>
<line x1="340" y1="374" x2="340" y2="405" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="393" text-anchor="start">broadcast on write</text>

<line x1="340" y1="464" x2="118" y2="508" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="464" x2="229" y2="508" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="464" x2="340" y2="508" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="464" x2="451" y2="508" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="464" x2="562" y2="508" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="70" y="510" width="96" height="46" rx="8" stroke-width="0.5"/>
<text class="ts" x="118" y="537" text-anchor="middle">Client</text>
</g>
<g class="c-purple">
<rect x="181" y="510" width="96" height="46" rx="8" stroke-width="0.5"/>
<text class="ts" x="229" y="537" text-anchor="middle">Client</text>
</g>
<g class="c-purple">
<rect x="292" y="510" width="96" height="46" rx="8" stroke-width="0.5"/>
<text class="ts" x="340" y="537" text-anchor="middle">Client</text>
</g>
<g class="c-purple">
<rect x="403" y="510" width="96" height="46" rx="8" stroke-width="0.5"/>
<text class="ts" x="451" y="537" text-anchor="middle">Client</text>
</g>
<g class="c-purple">
<rect x="514" y="510" width="96" height="46" rx="8" stroke-width="0.5"/>
<text class="ts" x="562" y="537" text-anchor="middle">every client in room</text>
</g>

<g class="c-amber">
<rect x="110" y="586" width="460" height="56" rx="8" stroke-width="1"/>
<text class="th" x="340" y="609" text-anchor="middle">events/sec = messages/sec × clients in room</text>
<text class="ts" x="340" y="627" text-anchor="middle">one broadcast to N clients = N events — big rooms hit the ceiling</text>
</g>

<rect class="c-purple" x="150" y="656" width="12" height="12" rx="3"/>
<text class="ts" x="168" y="666" text-anchor="start">our code</text>
<rect class="c-teal" x="250" y="656" width="12" height="12" rx="3"/>
<text class="ts" x="268" y="666" text-anchor="start">managed / external</text>
<rect class="c-amber" x="430" y="656" width="12" height="12" rx="3"/>
<text class="ts" x="448" y="666" text-anchor="start">scaling risk</text>
</svg>
